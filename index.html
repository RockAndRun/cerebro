<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d348b">
  <title>Cerebro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <style>
    :root {
      --bg: #f6f5fb; --fg: #1d1b2e; --muted: #5d5a73; --card: #fff; --line: #dcd9ea;
      --pri: #3d348b; --pri-fg: #fff; --alt: #e9e6f7; --warn: #c2410c; --ok: #2a9d3a; --bad: #d62828;
      --stage: #ecebf3;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15141d; --fg: #eeedf5; --muted: #a9a6bd; --card: #201e2c; --line: #34314a;
        --pri: #7b6ff0; --alt: #2b2840; --stage: #262433; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
    #app { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
    h1 { font-size: 30px; margin: 8px 0 4px; } h2 { font-size: 23px; margin: 12px 0; } h3 { font-size: 18px; margin: 16px 0 4px; }
    .txt p, .txt li { margin: 8px 0; } .small { font-size: 15px; color: var(--muted); } .center { text-align: center; }
    .warn-text { color: var(--warn); }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; user-select: none; }
    .big { display: block; width: 100%; padding: 16px; margin: 12px 0; border-radius: 14px; background: var(--pri); color: var(--pri-fg); font-weight: 600; }
    .big.alt { background: var(--alt); color: var(--fg); } .big.warn { background: var(--warn); color: #fff; }
    .big:active, .big.pressed { filter: brightness(1.25); transform: scale(.99); }
    .link { background: none; color: var(--muted); text-decoration: underline; display: block; margin: 8px auto; }
    .opts .big { text-align: left; }
    .note { background: var(--card); border-left: 4px solid var(--pri); padding: 10px 12px; border-radius: 8px; margin: 8px 0; }
    .stage { background: var(--stage); border-radius: 16px; height: 34vh; min-height: 200px; display: flex; align-items: center; justify-content: center; margin: 8px 0; }
    .stage.tap { height: 52vh; } .stage.short { height: 18vh; min-height: 110px; }
    .stim { font-size: 56px; font-weight: 700; letter-spacing: 1px; text-align: center; }
    .stim.inline { font-size: 38px; } .small-stim { font-size: 30px; }
    .dot-go { display: inline-block; width: 110px; height: 110px; border-radius: 50%; background: var(--ok); }
    .count { text-align: center; font-size: 30px; font-weight: 700; margin: 6px 0; }
    .live { min-height: 120px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 17px; }
    textarea, input { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chip { padding: 8px 12px; border-radius: 999px; background: var(--alt); }
    .chip.off { text-decoration: line-through; opacity: .45; }
    .row { display: flex; gap: 8px; } .row input { flex: 1; } .row button { padding: 0 14px; border-radius: 10px; background: var(--alt); }
    .display { text-align: center; font-size: 36px; font-weight: 700; letter-spacing: 6px; padding: 10px; background: var(--card); border-radius: 12px; margin: 10px 0; min-height: 64px; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pad button { padding: 18px 0; font-size: 26px; font-weight: 600; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    .pad button:active { background: var(--alt); } .pad .ok { background: var(--pri); color: var(--pri-fg); }
    .pad9 button { padding: 14px 0; }
    .key { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; text-align: center; background: var(--card); border-radius: 10px; padding: 6px 2px; }
    .key span { display: block; font-size: 24px; } .key b { font-size: 18px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .grid2 button { padding: 20px 0; font-size: 21px; font-weight: 600; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
    .grid2 button:active { background: var(--alt); }
    .board { position: relative; height: 72vh; background: var(--stage); border-radius: 14px; overflow: hidden; }
    .board svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .board line { stroke: var(--pri); stroke-width: 3; }
    .dot { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: var(--card); border: 2px solid var(--fg); font-size: 17px; font-weight: 700; }
    .dot.done { background: var(--pri); color: var(--pri-fg); border-color: var(--pri); } .dot.bad { background: var(--bad); color: #fff; }
    .tol { display: flex; justify-content: center; gap: 18px; align-items: flex-end; padding: 10px; background: var(--stage); border-radius: 14px; }
    .goal .tol { transform: scale(.6); transform-origin: top center; margin-bottom: -40px; background: transparent; outline: 2px dashed var(--line); }
    .peg { position: relative; width: 80px; height: calc(var(--cap) * 54px + 14px); display: flex; flex-direction: column-reverse; align-items: center; padding-bottom: 6px; border-bottom: 6px solid var(--muted); border-radius: 4px; }
    .peg.sel { background: var(--alt); }
    .pole { position: absolute; bottom: 0; width: 8px; height: 100%; background: var(--muted); border-radius: 4px; }
    .ball { position: relative; width: 52px; height: 52px; border-radius: 50%; margin-top: 2px; }
    .bR { background: #d62828; } .bV { background: #2a9d3a; } .bA { background: #1f5fd1; }
    .peg.sel .ball:last-child { outline: 4px solid #e0a800; }
    .switch { display: grid; grid-template-rows: 1fr 1fr; height: 46vh; border: 3px solid var(--fg); border-radius: 14px; overflow: hidden; }
    .half { position: relative; display: flex; align-items: center; justify-content: center; background: var(--stage); }
    .half + .half { border-top: 3px solid var(--fg); } .half.bad { background: #f5c6c6; }
    .tag { position: absolute; top: 6px; left: 10px; font-size: 13px; color: var(--muted); }
    .list { padding-left: 20px; } .list li { margin: 6px 0; } ul ul { font-size: 15px; color: var(--muted); }
  </style>
</head>
<body>
  <main id="app"><p>Cargando…</p></main>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tareas-memoria.js"></script>
  <script src="js/tareas-lenguaje.js"></script>
  <script src="js/tareas-ejecutivas.js"></script>
  <script src="js/tareas-complejas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
